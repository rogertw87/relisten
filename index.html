<title>信任重聽進度表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E4%BC%91%E6%81%AF%E6%94%BE%E9%AC%86%E5%AE%89%E9%9D%9C%E4%B8%AD%E5%BF%83%E6%9C%AC%E6%80%A7%E8%87%A3%E6%9C%8D%E7%9C%9F%E5%AF%A6%E4%BF%A1%E4%BB%B0%E4%BB%BB%E5%9C%93%E6%BB%BF&display=swap">
<style>
/* Theme carried over from 好好呼吸 (haohao-breath): the same six palettes, typefaces and background layers.
   Layout: one 480px column like that site. Title, a summary card, a sticky progress strip, then ten week
   groups of day rows; each row has the day number on the left and a four-slot strip of session checks on the right. */
:root {
  --ink: #15303a;
  --ink-2: #2f6475;
  --muted: #4a6872;
  --muted-2: #5d7f8a;
  --accent: #1f6f86;
  --accent-2: #3f8fa6;
  --line: #d9e8ec;
  --line-2: #cfe2e8;
  --line-3: #e6f0f3;
  --soft: #f4f9fa;
  --soft-2: #e2eff2;
  --chip: #e3f0f3;
  --screen: #eef4f5;
  --page: #ffffff;
  --card: #ffffff;
  --track: #c3dbe2;
  --shadow: rgba(21,48,58,.15);
  --sel: var(--ink);
  --selfg: var(--screen);
  --warn: #b4472e; --seal: #c0432c;
  --sans: "Noto Sans TC", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --serif: "Noto Serif TC", "Songti TC", "Noto Serif CJK TC", "PMingLiU", serif;
  --sealw: clamp(46px, 13vw, 58px);
  --chipw: clamp(40px, 11.5vw, 48px);
}
/* 深色：沒有另外選主題時，跟著裝置或 Claude 的深色設定 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-skin]) {
    --ink: #e6f1f4; --ink-2: #8fc3d3; --muted: #a3bfc8; --muted-2: #8aa9b3;
    --accent: #7cc4da; --accent-2: #6bb6cc;
    --line: #1f3943; --line-2: #23404b; --line-3: #1c3640;
    --soft: #132a33; --soft-2: #16303a; --chip: #173039;
    --screen: #0d1b22; --page: #0d1b22; --card: #132a33;
    --track: #2a4a56; --shadow: rgba(0,0,0,.4);
    --warn: #ffc08a; --seal: #ef7d62;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-skin]),
:root[data-skin="dark"] {
  --ink: #e6f1f4; --ink-2: #8fc3d3; --muted: #a3bfc8; --muted-2: #8aa9b3;
  --accent: #7cc4da; --accent-2: #6bb6cc;
  --line: #1f3943; --line-2: #23404b; --line-3: #1c3640;
  --soft: #132a33; --soft-2: #16303a; --chip: #173039;
  --screen: #0d1b22; --page: #0d1b22; --card: #132a33;
  --track: #2a4a56; --shadow: rgba(0,0,0,.4);
  --warn: #ffc08a; --seal: #ef7d62;
  color-scheme: dark;
}
:root[data-skin="light"] { color-scheme: light; }
:root[data-skin="night"] { /* 夜空 */
  --page: #0a0d24; --screen: #000000;
  --ink: #eef0fb; --ink-2: #c9cff5;
  --accent: #e6c36a; --accent-2: #8fa2f0;
  --line-2: #2a3266; --line: #232a58; --line-3: #141a3c;
  --soft-2: #12173f; --chip: #141a3c; --soft: #0a0d24;
  --muted-2: #a9afd2; --muted: #c0c5e3;
  --track: #6a5d2f; --shadow: rgba(0,0,0,.5); --card: #10143a;
  --sel: #e6c36a; --selfg: #141a3a;
  --warn: #ffc08a; --seal: #f08a6c;
  color-scheme: dark;
}
:root[data-skin="fire"] { /* 營火 */
  --page: #1a0f0c; --screen: #160c09;
  --ink: #fbe9dc; --ink-2: #ffb27a;
  --accent: #ff8a4c; --accent-2: #ffa24c;
  --line-2: #5a3324; --line: #3e241a; --line-3: #3a2015;
  --soft-2: #2e1912; --chip: #3a2015; --soft: #1a0f0c;
  --muted-2: #c9a08c; --muted: #dcbfac;
  --track: #8a4a24; --shadow: rgba(0,0,0,.5); --card: #28140e;
  --sel: #ff8a4c; --selfg: #1a0f0c;
  --warn: #ffd9a0; --seal: #ff7350;
  color-scheme: dark;
}
:root[data-skin="fireflies"] { /* 螢火蟲 */
  --page: #06100d; --screen: #050d0b;
  --ink: #eaf3dc; --ink-2: #d6ef7c;
  --accent: #bfe36a; --accent-2: #dcf77a;
  --line-2: #2a3d2e; --line: #1b2b21; --line-3: #1c2918;
  --soft-2: #142019; --chip: #1c2918; --soft: #06100d;
  --muted-2: #9db497; --muted: #b9ccb2;
  --track: #5f7a2c; --shadow: rgba(0,0,0,.5); --card: #0d1a14;
  --sel: #bfe36a; --selfg: #06100d;
  --warn: #ffc08a; --seal: #ef7d62;
  color-scheme: dark;
}
:root[data-skin="sakura"] { /* 櫻花 */
  --page: #fff7f9; --screen: #fff5f7;
  --ink: #3b2a30; --ink-2: #c4537a;
  --accent: #d0688c; --accent-2: #e77fa3;
  --line-2: #f0cfd9; --line: #f6e1e8; --line-3: #fde8ee;
  --soft-2: #fbe3ea; --chip: #fde8ee; --soft: #fff7f9;
  --muted-2: #8a6a74; --muted: #6f5560;
  --track: #e9a9bf; --shadow: rgba(59,42,48,.14); --card: #ffffff;
  --sel: #c4537a; --selfg: #ffffff;
  --warn: #b4472e; --seal: #b83a2b;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 0.9375rem;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 一欄 480px，和好好呼吸的首頁一樣；主題背景鋪在這一欄底下 */
.home {
  position: relative; isolation: isolate;
  max-width: 480px; margin: 0 auto;
  background: var(--page);
  padding-block: 56px 48px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.home::before {
  content: ""; display: none; position: fixed; top: 0; bottom: 0; left: 50%; width: 100%; max-width: 480px;
  transform: translateX(-50%); z-index: -1; pointer-events: none;
  background: #000 var(--sky, none) center / cover;
}
:root[data-skin="night"] .home::before { display: block; }
/* 營火：清單的字比較密，把下方火光壓暗一些 */
:root[data-skin="fire"] .home::before {
  display: block;
  background: linear-gradient(to top, rgba(26,15,12,.55), rgba(26,15,12,0) 62%), var(--page) var(--sky, none) center bottom / cover;
}
:root[data-skin="fireflies"] .home::before { display: block; background: var(--page) var(--sky, none) center bottom / cover; }
:root[data-skin="sakura"] .home::before { display: block; background: var(--page) url('assets/sakura.jpg') center -18px / cover; }
/* 火星、螢火蟲、花瓣、流星：畫在背景之上、文字之下 */
.sparks { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.home > .sparks { left: 50%; max-width: 480px; transform: translateX(-50%); }

/* 右上角選單：主題 */
.menu { position: absolute; top: 66px; right: max(14px, env(safe-area-inset-right, 0px)); z-index: 6; }
.menu-btn {
  width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%; background: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.menu-btn:hover { opacity: .75; }
.menu-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.menu-pop {
  position: absolute; top: 48px; right: 0; min-width: 160px; padding: 6px 0; border-radius: 14px;
  border: 1px solid var(--line); background: var(--page); box-shadow: 0 8px 24px var(--shadow);
  display: flex; flex-direction: column;
}
.menu-theme { min-width: 210px; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
.menu-theme-title { font-size: 0.75rem; color: var(--muted); }
.menu-theme-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.menu-theme-opt {
  min-height: 36px; padding: 0 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); font-size: 0.8125rem; cursor: pointer; white-space: nowrap;
}
.menu-theme-opt.on { background: var(--sel); color: var(--selfg); border-color: var(--sel); }

/* 標題 */
.head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.title {
  margin: 8px 8px 0; font-size: 2.125rem; font-weight: 500; line-height: 1.3;
  letter-spacing: .3em; text-indent: .3em; color: var(--ink-2);
}
.sub { margin: 0; font-size: 0.8125rem; letter-spacing: .14em; text-indent: .14em; color: var(--muted-2); }

/* 整體進度 */
.summary {
  padding: 18px 20px; border-radius: 20px; background: var(--soft); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px;
}
.total { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total .num { font: 300 2.5rem/1 var(--mono); letter-spacing: -.02em; }
.total .of { color: var(--muted); }
.total .days { margin-left: auto; color: var(--muted); font-size: 0.875rem; }
.total .days b { color: var(--ink); font-weight: 500; }
.track { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.track > i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--accent); transition: width .25s ease; }

/* 黏在上方的進度列 */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: -8px; padding: 8px;
  background: var(--page);
  background: color-mix(in srgb, var(--page) 84%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px;
}
.bar .row1 { display: flex; align-items: center; gap: 12px; }
.bar .count { white-space: nowrap; font-size: 0.875rem; color: var(--muted); }
.bar .count b { font: 500 0.9375rem var(--mono); color: var(--ink); }
.bar .track { flex: 1 1 auto; min-width: 2rem; height: 4px; }
.btn {
  min-height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); font-size: 0.8125rem; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent-2); }
.btn:disabled { opacity: .5; cursor: default; }
.bar .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.8125rem; color: var(--muted-2); min-height: 1.5rem; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-width: 0; flex: 1 1 auto; }
.status.warn { color: var(--warn); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: inherit; }
.hide { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.hide input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }

/* 每週的清單 */
.weeks { display: flex; flex-direction: column; gap: 28px; }
.week h2 {
  margin: 0; display: flex; align-items: baseline; gap: 10px;
  font-size: 0.8125rem; font-weight: 500; letter-spacing: .08em; color: var(--ink-2);
  padding: 0 4px 8px; border-bottom: 1px solid var(--line);
}
.week h2 .range, .week h2 .wcnt { font: 400 0.75rem var(--mono); letter-spacing: 0; color: var(--muted-2); }
.week h2 .wcnt { margin-left: auto; }
.week ol { list-style: none; margin: 0; padding: 0; }
.day {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid var(--line);
  scroll-margin-top: 7rem;
}
.info { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dates { display: flex; flex-direction: column; min-width: 0; line-height: 1.4; }
.dates .orig { font-size: 1.0625rem; white-space: nowrap; letter-spacing: .04em; }
.dates .orig .dn { font: 400 1.125rem/1 var(--mono); letter-spacing: 0; margin: 0 3px; }
.dates .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; font-size: 0.8125rem; color: var(--muted-2); }
.dates .sub:empty { display: none; }
.tag { flex: none; padding: 1px 8px; border-radius: 12px; background: var(--soft-2); font-size: 0.75rem; color: var(--ink-2); }
.day.done .info { opacity: .5; }

.checks { display: grid; grid-template-columns: repeat(4, var(--chipw)); gap: 6px; }
.chk {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  width: var(--chipw); height: 50px;
  border: 1px solid var(--line-2); border-radius: 12px;
  background: var(--card); color: var(--muted);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
.chk.x { border-style: dashed; }
.chk input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chk .k { font-size: 0.875rem; line-height: 1; }
.chk .mark { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--track); }
.chk.on { background: var(--sel); border-color: var(--sel); border-style: solid; color: var(--selfg); }
.chk.on .k { font-weight: 500; }
.chk.on .mark {
  width: 12px; height: 7px; border: 0; border-radius: 0;
  border-left: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: translateY(-2px) rotate(-45deg);
}
.chk:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.chk input:focus-visible + .k { text-decoration: underline; }
.chk.off { opacity: .5; cursor: default; }
.chk.off input { cursor: default; }
.weeks.hide-done .day.done { display: none; }
.week .alldone { margin: 0; padding: 12px 4px; color: var(--muted-2); font-size: 0.8125rem; border-bottom: 1px solid var(--line); }

.foot { margin: 0 4px; color: var(--muted-2); font-size: 0.75rem; line-height: 1.7; text-wrap: pretty; }

/* 選單裡的「印章冊」 */
.menu-theme + .menu-item { border-top: 1px solid var(--line); margin-top: 4px; }
.menu-item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 14px;
  border: none; background: none; font-size: 0.875rem; color: var(--ink); cursor: pointer; text-align: left;
}
.menu-item:hover { background: color-mix(in srgb, var(--screen) 50%, transparent); }
.menu-item svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.menu-n { margin-left: auto; font: 400 0.75rem var(--mono); color: var(--muted-2); }

/* 印章冊畫面：和好好呼吸的勳章頁一樣蓋住整個畫面；每聽完一週蓋一個印章 */
.noscroll, .noscroll body { overflow: hidden; }
.screen {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; overscroll-behavior: contain;
  background: var(--page) var(--sky, none) center bottom / cover;
}
:root[data-skin="night"] .screen { background-color: #000; background-position: center; }
:root[data-skin="sakura"] .screen { background: var(--page) url('assets/sakura.jpg') center -18px / cover; }
.screen-inner {
  max-width: 480px; min-height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; gap: 18px;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.back {
  align-self: flex-start; min-height: 44px; padding: 8px 0;
  border: none; background: none; color: var(--ink-2); font-size: 0.9375rem; cursor: pointer;
}
.book-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px; }
.book-head h2 { margin: 0; font-size: 1.625rem; font-weight: 700; line-height: 1.3; }
.book-n { font: 400 0.875rem var(--mono); color: var(--muted-2); }
.book { padding: 26px 16px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); }
.seals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px 4px; }
.seal-item {
  min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 4px 0; border: 0; border-radius: 12px; background: none; cursor: pointer;
}
.seal {
  width: var(--sealw); height: var(--sealw); border-radius: 50%;
  border: 1.5px dashed var(--track); color: var(--track);
  display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl;
  font: 700 0.875rem/1 var(--serif); letter-spacing: .06em;
  transition: border-color .15s ease;
}
.seal.square { border-radius: 12px; }
.seal-item:hover .seal:not(.on) { border-color: var(--accent-2); }
.seal.on { border: 2px solid var(--seal); color: var(--seal); box-shadow: inset 0 0 0 2.5px var(--card), inset 0 0 0 3.5px var(--seal); }
.seal-cap { display: inline-flex; align-items: center; gap: 3px; font-size: 0.6875rem; color: var(--muted-2); white-space: nowrap; }
.seal-item.has-rw .seal-cap::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

.plan-note { margin: 0; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }

/* 日期設定視窗 */
.award.date-panel { align-items: stretch; text-align: left; gap: 18px; padding: 28px 22px 22px; }
.award.date-panel .aw-title { text-align: center; }
.opt { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.opt input[type="checkbox"] { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.opt-text, .opt-block { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.opt-block { border-top: 1px solid var(--line); padding-top: 16px; }
.opt-name { font-size: 0.9375rem; font-weight: 500; color: var(--ink); }
.opt-sub { font-size: 0.8125rem; line-height: 1.55; color: var(--muted-2); }
.opt-row { display: flex; gap: 8px; margin-top: 8px; }
.opt-row input[type="date"] {
  flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 8px 10px;
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); border-radius: 12px;
}
.aw-alt.small { flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px; font-size: 0.875rem; }
.aw-alt:disabled { opacity: .45; cursor: default; }
.opt-note { margin: 4px 0 0; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }
.opt-note:empty { display: none; }

/* 新印章、獎勵設定的彈出視窗 */
.award-bg {
  position: fixed; inset: 0; z-index: 30; background: rgba(6,16,21,.55);
  display: flex; align-items: center; justify-content: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
}
.award {
  width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto;
  background: var(--page); color: var(--ink); border-radius: 28px;
  padding: 32px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.aw-small { font-size: 0.8125rem; color: var(--muted-2); }
.aw-stamp {
  flex: none; width: 120px; height: 120px; border-radius: 50%; margin: 6px 0;
  border: 3px solid var(--seal); color: var(--seal);

  display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl;
  font: 700 2rem/1 var(--serif); letter-spacing: .08em;
}
.aw-stamp.square { border-radius: 28px; }
.aw-stamp.off { border: 2px dashed var(--track); color: var(--track); box-shadow: none; transform: none; }
.aw-stamp.stamping { animation: stampIn .5s cubic-bezier(.2, .8, .3, 1.15) both; }
@keyframes stampIn {
  0% { opacity: 0; transform: scale(1.7) rotate(-7deg); }
  55% { opacity: 1; transform: scale(.94) rotate(-7deg); }
  100% { opacity: 1; transform: scale(1) rotate(-7deg); }
}
.aw-title { margin: 0; font-size: 1.375rem; font-weight: 500; line-height: 1.4; }
.aw-sub { margin: 0; font-size: 0.9375rem; line-height: 1.6; color: var(--muted); text-wrap: pretty; overflow-wrap: anywhere; }
.rw { align-self: stretch; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; text-align: left; }
.rw label { font-size: 0.8125rem; color: var(--muted-2); }
.rw input {

  font: inherit; font-size: 1rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); border-radius: 12px;
}
.rw input::placeholder { color: var(--muted-2); opacity: .75; }
.rw input:disabled { opacity: .6; }
.aw-btns { display: flex; gap: 8px; margin-top: 8px; }
.aw-btns > * { flex: 1 1 0; }
.aw-ok {

  background: var(--sel); color: var(--selfg); font-size: 1rem; font-weight: 500; cursor: pointer;
}
.aw-alt {
  min-height: 50px; border: 1px solid var(--line); border-radius: 16px;
  background: none; color: var(--ink); font-size: 1rem; cursor: pointer;
}

@media (max-width: 22.5rem) {

}

      <button type="button" class="menu-item" id="dateOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3M16 3v3M4 10h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"></path></svg><span>日期</span><span class="menu-n" id="menuDateN"></span></button>
    </div>
  </div>
  <header class="head">

  </header>

  <section class="summary" aria-label="整體進度">

    <div class="track" id="totalTrack" role="progressbar" aria-label="已聽段數" aria-valuemin="0" aria-valuemax="186" aria-valuenow="0"><i id="totalFill"></i></div>

      </div>
    </form>
    <button type="button" class="aw-ok" id="shOk" hidden>收下</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Calendar of the original 共修 ---------- */
  var TOTAL_DAYS = 62;
  var FIRST = new Date(2026, 6, 1);
  var WD = ["日", "一", "二", "三", "四", "五", "六"];
  var SESS = [["m", "早", "早上"], ["n", "午", "中午"], ["e", "晚", "晚上"]];
  var LS_STATE = "trust-relisten:state";
  var LS_HIDE = "trust-relisten:hide-done";
  var LS_DATES = "trust-relisten:show-dates";

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function parseIso(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  function dayDiff(a, b) {
    return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 86400000);
  }
  function md(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }

  var days = [];
  var ALL_KEYS = [];
  for (var i = 0; i < TOTAL_DAYS; i++) {
    var date = addDays(FIRST, i);
    var dow = date.getDay();
    var weekend = dow === 0 || dow === 6;
    var d = { i: i, n: i + 1, id: "d" + pad(i + 1), date: date, dow: dow, weekend: weekend,
              week: Math.floor(i / 7) };
    days.push(d);
    SESS.forEach(function (s) { ALL_KEYS.push(d.id + s[0]); });
    if (weekend) ALL_KEYS.push(d.id + "x");
  }
  var MAIN_TOTAL = TOTAL_DAYS * 3;
  var WEEKS = Math.ceil(TOTAL_DAYS / 7);            // 9 週：每 7 天一週，最後一週 6 天
  var WEEK_DAYS = [];
  days.forEach(function (d) { (WEEK_DAYS[d.week] = WEEK_DAYS[d.week] || []).push(d); });
  var NUM = ["一", "二", "三", "四", "五", "六", "七", "八", "九"];
  // 印章：每聽完一週蓋一個，全部聽完再蓋「圓滿」；樣式和好好呼吸的印章冊一樣
  var STAMPS = ["休息", "放鬆", "安靜", "中心", "本性", "臣服", "真實", "信仰", "信任", "圓滿"];
  var ST_ROT = [-6, 4, -3, 7, -5, 3, -4, 6, -5, -7];
  var ALL = WEEKS;                                   // 「圓滿」在印章冊裡的位置

  /* ---------- State ---------- */
  var state = { done: {}, rewards: {}, start: null };   // start：重聽排程的開始日期，沒排程是 null
  var mode = "loading";            // loading | cloud | local | readonly
  var hideDone = false;
  var showDates = false;           // 顯示原本共修的日期（只記在這台裝置）

  /* ---------- Build the list once ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var weeksEl = $("weeks");
  var rows = [];
  var weekEls = [];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function makeChk(day, code, short, long) {
    var key = day.id + code;
    var label = el("label", "chk " + code + " off");
    var input = document.createElement("input");
    input.type = "checkbox";
    input.id = key;
    input.disabled = true;
    input.setAttribute("aria-label", "第 " + day.n + " 天（" + md(day.date) + "）" + long);
    input.addEventListener("change", function () { onToggle(key, input.checked); });
    label.appendChild(input);
    label.appendChild(el("span", "k", short));
    var mark = el("span", "mark");
    mark.setAttribute("aria-hidden", "true");
    label.appendChild(mark);
    return { key: key, label: label, input: input };
  }

  function build() {
    var byWeek = {};
    days.forEach(function (d) { (byWeek[d.week] = byWeek[d.week] || []).push(d); });
    Object.keys(byWeek).map(Number).sort(function (a, b) { return a - b; }).forEach(function (w) {
      var list = byWeek[w];
      var sec = el("section", "week");
      var h = el("h2");
      h.appendChild(el("span", null, "第 " + (w + 1) + " 週"));
      var a = list[0].date, b = list[list.length - 1].date;
      var range = el("span", "range", md(a) + "–" + md(b));
      range.hidden = true;
      h.appendChild(range);
      var wcnt = el("span", "wcnt", "");
      h.appendChild(wcnt);
      sec.appendChild(h);
      var ol = el("ol");
      list.forEach(function (d) {
        var li = el("li", "day");
        li.id = "day-" + pad(d.n);
        var info = el("div", "info");
        var dates = el("div", "dates");
        var orig = el("span", "orig");
        orig.appendChild(document.createTextNode("第"));
        orig.appendChild(el("span", "dn", pad(d.n)));
        orig.appendChild(document.createTextNode("天"));
        dates.appendChild(orig);
        var sub = el("span", "sub");
        dates.appendChild(sub);
        info.appendChild(dates);
        li.appendChild(info);
        var checks = el("div", "checks");
        var chks = {};
        SESS.forEach(function (s) {
          var c = makeChk(d, s[0], s[1], s[2]);
          chks[s[0]] = c; checks.appendChild(c.label);
        });
        if (d.weekend) {
          var x = makeChk(d, "x", "補", "週末補充");
          chks.x = x; checks.appendChild(x.label);
        }
        li.appendChild(checks);
        ol.appendChild(li);
        rows[d.i] = { li: li, chks: chks, sub: sub };
      });
      sec.appendChild(ol);
      var all = el("p", "alldone", "這一週都聽完了。");
      all.hidden = true;
      sec.appendChild(all);
      weeksEl.appendChild(sec);
      weekEls.push({ list: list, wcnt: wcnt, alldone: all, range: range });
    });
  }

  /* ---------- Paint from state ---------- */
  function isDone(key) { return state.done[key] === true; }

  function nextIndex() {
    for (var i = 0; i < days.length; i++) {
      for (var s = 0; s < SESS.length; s++) {
        if (!isDone(days[i].id + SESS[s][0])) return { i: i, s: s };
      }
    }
    return null;
  }

  function setWidth(id, part, whole) { $(id).style.width = (whole ? (part / whole) * 100 : 0) + "%"; }

  function paint() {
    var editable = mode === "cloud" || mode === "local";
    var nx = nextIndex();
    var cnt = { m: 0, n: 0, e: 0, x: 0 }, fullDays = 0;
    var start = parseIso(state.start);
    var todayIdx = start ? dayDiff(new Date(), start) : null;

    days.forEach(function (d) {
      var r = rows[d.i], main = 0;
      Object.keys(r.chks).forEach(function (code) {
        var c = r.chks[code], on = isDone(c.key);
        if (c.input.checked !== on) c.input.checked = on;
        c.input.disabled = !editable;
        c.label.classList.toggle("on", on);
        c.label.classList.toggle("off", !editable);
        if (on) { cnt[code]++; if (code !== "x") main++; }
      });
      var done = main === 3;
      if (done) fullDays++;
      r.li.classList.toggle("done", done);
      r.sub.textContent = "";
      if (showDates) r.sub.appendChild(el("span", "od", md(d.date) + " 週" + WD[d.dow]));
      if (start) {
        var pd = addDays(start, d.i);
        r.sub.appendChild(el("span", "re", "重聽 " + md(pd) + " 週" + WD[pd.getDay()]));
        if (todayIdx === d.i) r.sub.appendChild(el("span", "tag", "今天"));
      }
    });

    var mainDone = cnt.m + cnt.n + cnt.e;
    $("doneCount").textContent = mainDone;
    $("barCount").textContent = mainDone;
    $("dayCount").textContent = fullDays;
    $("totalTrack").setAttribute("aria-valuenow", mainDone);
    setWidth("totalFill", mainDone, MAIN_TOTAL);
    setWidth("barFill", mainDone, MAIN_TOTAL);

    weekEls.forEach(function (w) {
      var got = 0;
      w.list.forEach(function (d) { SESS.forEach(function (s) { if (isDone(d.id + s[0])) got++; }); });
      var whole = w.list.length * 3;
      w.wcnt.textContent = got + " / " + whole;
      w.alldone.hidden = !(hideDone && got === whole);
      w.range.hidden = !showDates;
    });
    weeksEl.classList.toggle("hide-done", hideDone);

    var nSeal = 0;
    sealEls.forEach(function (s, k) {
      var on = sealOn(k), rw = state.rewards[rwKey(k)] || "";
      if (on) nSeal++;
      s.st.classList.toggle("on", on);
      s.st.style.transform = on ? "rotate(" + ST_ROT[k] + "deg)" : "";
      s.btn.classList.toggle("has-rw", !!rw);
      var label = sealName(k) + "的印章「" + STAMPS[k] + "」：" + (on ? "已蓋章" : k === ALL ? "全部聽完後蓋章" : "已聽 " + weekGot(k) + " / " + weekWhole(k) + " 段");
      if (rw) label += "。獎勵：" + rw;
      s.btn.setAttribute("aria-label", label);
    });
    $("sealCount").textContent = nSeal + " / " + (WEEKS + 1);
    $("menuSealN").textContent = nSeal + " / " + (WEEKS + 1);

    // 日期：重聽排程的說明、選單旁的狀態、設定視窗裡的欄位
    var plan = "";
    if (start) {
      var end = addDays(start, TOTAL_DAYS - 1);
      plan = "每天聽一天份，" + md(end) + "（週" + WD[end.getDay()] + "）聽完。";
      if (todayIdx < 0) plan += md(start) + " 開始。";
      else if (todayIdx < TOTAL_DAYS) plan += "今天排的是第 " + (todayIdx + 1) + " 天。";
    }
    $("planNote").textContent = plan;
    $("planNote").hidden = !plan;
    $("dsNote").textContent = plan;
    $("menuDateN").textContent = start ? md(start) + " 起" : showDates ? "顯示中" : "";
    var startInput = $("start");
    if (document.activeElement !== startInput) startInput.value = state.start || "";
    startInput.disabled = !editable;
    $("startClear").disabled = !editable || !start;
    $("showDates").checked = showDates;

    var nb = $("nextBtn");
    nb.disabled = !nx;
    nb.textContent = nx ? "下一段" : "全部聽完";
    nb.setAttribute("aria-label", nx
      ? "跳到下一段還沒聽的：第 " + days[nx.i].n + " 天" + SESS[nx.s][2]
      : "全部聽完");
  }

  /* ---------- 印章冊 ---------- */
  function weekGot(w) {
    var got = 0;
    WEEK_DAYS[w].forEach(function (d) { SESS.forEach(function (s) { if (isDone(d.id + s[0])) got++; }); });
    return got;
  }
  function weekWhole(w) { return WEEK_DAYS[w].length * 3; }
  function sealOn(k) {
    if (k === ALL) { for (var w = 0; w < WEEKS; w++) if (weekGot(w) < weekWhole(w)) return false; return true; }
    return weekGot(k) === weekWhole(k);
  }
  function rwKey(k) { return k === ALL ? "all" : "w" + (k + 1); }
  function sealName(k) { return k === ALL ? "全部" : "第" + NUM[k] + "週"; }
  function sealRange(k) {
    if (k === ALL) return "第 1–" + TOTAL_DAYS + " 天";
    var l = WEEK_DAYS[k];
    return "第 " + l[0].n + "–" + l[l.length - 1].n + " 天";
  }
  function reducedMo() { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }

  var sealEls = [];
  function buildSeals() {
    var box = $("seals");
    for (var k = 0; k <= WEEKS; k++) {
      (function (k) {
        var b = el("button", "seal-item");
        b.type = "button";
        var st = el("span", "seal" + (k % 3 === 1 ? " square" : ""), STAMPS[k]);
        st.setAttribute("aria-hidden", "true");
        b.appendChild(st);
        b.appendChild(el("span", "seal-cap", sealName(k)));
        b.addEventListener("click", function () { openSeal(k); });
        box.appendChild(b);
        sealEls.push({ btn: b, st: st });
      })(k);
    }
  }

  var sheet = $("sheet"), sheetKey = null, sheetQueue = [], lastFocus = null;
  function setStamp(k, on, animate) {
    var s = $("shStamp");
    s.textContent = STAMPS[k];
    s.className = "aw-stamp" + (k % 3 === 1 ? " square" : "") + (on ? "" : " off");
    if (on && animate && !reducedMo()) { void s.offsetWidth; s.classList.add("stamping"); }
  }
  function openSheet(focusEl) {
    if (sheet.hidden) lastFocus = document.activeElement;
    sheet.hidden = false;
    try { focusEl.focus({ preventScroll: true }); } catch (e) {}
  }
  function closeSheet() {
    sheet.hidden = true;
    sheetKey = null; sheetQueue = [];
    if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
    lastFocus = null;
  }
  // 剛聽完一週：跳出新印章；同時全部聽完的話，接著再跳「圓滿」
  function showAward() {
    var k = sheetQueue[0];
    if (k == null) { closeSheet(); return; }
    sheetKey = null;
    var rw = state.rewards[rwKey(k)] || "";
    $("shSmall").textContent = "新的印章";
    setStamp(k, true, true);
    $("shTitle").textContent = k === ALL ? TOTAL_DAYS + " 天都聽完了" : sealName(k) + "聽完了";
    $("shSub").textContent = rw ? "給自己的獎勵：" + rw : "已經蓋在你的印章冊裡。";
    $("shForm").hidden = true;
    $("shOk").hidden = false;
    openSheet($("shOk"));
  }
  function nextAward() { sheetQueue.shift(); if (sheetQueue.length) showAward(); else closeSheet(); }
  // 點印章冊裡的印章：看那一週的進度，寫下聽完後要給自己的獎勵
  function openSeal(k) {

    sheetKey = k;
    var on = sealOn(k), editable = mode === "cloud" || mode === "local";
    $("shSmall").textContent = sealRange(k);
    setStamp(k, on, false);
    $("shTitle").textContent = k === ALL ? "全部聽完" : sealName(k);
    var sub;
    if (on) sub = "已經蓋章了。";
    else if (k === ALL) { var c = 0; for (var w = 0; w < WEEKS; w++) if (sealOn(w)) c++; sub = "已蓋 " + c + " / " + WEEKS + " 週的印章"; }
    else sub = "已聽 " + weekGot(k) + " / " + weekWhole(k) + " 段";
    $("shSub").textContent = sub;
    $("rwLabel").textContent = k === ALL ? "全部聽完，給自己的獎勵" : "聽完這一週，給自己的獎勵";
    var input = $("rwInput");
    input.value = state.rewards[rwKey(k)] || "";
    input.disabled = !editable;
    $("shSave").hidden = !editable;
    $("shForm").hidden = false;
    $("shOk").hidden = true;
    openSheet($("shClose"));
  }

  // 印章冊放在右上角選單裡，打開時蓋住整個畫面
  var bookScreen = $("bookScreen");
  function openBook() {
    $("menuPop").hidden = true;
    $("menuBtn").setAttribute("aria-expanded", "false");
    bookScreen.hidden = false;
    bookScreen.scrollTop = 0;
    document.documentElement.classList.add("noscroll");
    try { $("bookBack").focus({ preventScroll: true }); } catch (e) {}
  }
  function closeBook() {
    bookScreen.hidden = true;
    document.documentElement.classList.remove("noscroll");
    try { $("menuBtn").focus({ preventScroll: true }); } catch (e) {}
  }

  /* ---------- Status line ---------- */
  var statusEl = $("status");
  function setStatus(text, warn, action) {
    statusEl.textContent = text;
    statusEl.classList.toggle("warn", !!warn);
    if (action) {
      var b = el("button", "linkbtn", action.label);
      b.type = "button";
      b.addEventListener("click", action.run);
      statusEl.appendChild(b);
    }
  }

  /* ---------- Saving: the db capability, with a this-device fallback ---------- */

  function newPatch() { return { done: {}, rewards: {} }; }

  function applyRemote(data) {
    lastRemote = data || {};

    ALL_KEYS.forEach(function (k) { if (remote[k] === true) done[k] = true; });
    var rr = lastRemote.rewards && typeof lastRemote.rewards === "object" ? lastRemote.rewards : {};

  function fullRewards() {
    var out = {};
    Object.keys(state.rewards).forEach(function (k) { if (state.rewards[k]) out[k] = state.rewards[k]; });
    return out;
  }

  function fullDone() {
    var out = {};
    Object.keys(state.done).forEach(function (k) { if (state.done[k] === true) out[k] = true; });
    return out;
  }

  function writePatch(patch) {
    var body = {};
    if (Object.keys(patch.done).length) body.done = patch.done;
    if (Object.keys(patch.rewards).length) body.rewards = patch.rewards;
    if ("start" in patch) body.start = patch.start;
    var whole = function () {
      return ref.set({ done: fullDone(), rewards: fullRewards(), start: state.start }).then(function () { docExists = true; });
    };
    if (!docExists) return whole();
    return ref.update(body).catch(function (e) {
      if (e && e.code === "invalid_argument") return whole();
      throw e;
    });
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(function () { flush(false); }, 500);
  }

  function flush(isRetry) {
    clearTimeout(timer);
    if (mode !== "cloud" || writing || !hasPending()) return;
    writing = true;
    inflight = pending;
    pending = newPatch();
    setStatus("儲存中…");
    writePatch(inflight).then(function () {
      inflight = null; writing = false; failed = false;
      if (hasPending()) schedule(); else setStatus("已儲存");
    }, function (e) {
      var back = inflight; inflight = null; writing = false;
      var merged = {}; Object.keys(back.done).forEach(function (k) { merged[k] = back.done[k]; });

      pending.done = merged;
      var mergedR = {}; Object.keys(back.rewards).forEach(function (k) { mergedR[k] = back.rewards[k]; });
      Object.keys(pending.rewards).forEach(function (k) { mergedR[k] = pending.rewards[k]; });
      pending.rewards = mergedR;

        mode = "readonly";

  function saveLocal() {
    try { localStorage.setItem(LS_STATE, JSON.stringify({ done: fullDone(), rewards: fullRewards(), start: state.start })); } catch (e) {}
  }

      }

  }

  buildSeals();
  try { hideDone = localStorage.getItem(LS_HIDE) === "1"; } catch (e) {}
  try { showDates = localStorage.getItem(LS_DATES) === "1"; } catch (e) {}

  $("dsClose").addEventListener("click", closeDates);
  dateSheet.addEventListener("click", function (ev) { if (ev.target === dateSheet) closeDates(); });
  $("showDates").addEventListener("change", function (ev) {
    showDates = ev.target.checked;
    try { localStorage.setItem(LS_DATES, showDates ? "1" : "0"); } catch (e) {}

  });

  $("shOk").addEventListener("click", nextAward);
  $("shClose").addEventListener("click", closeSheet);
  $("shForm").addEventListener("submit", function (ev) {
    ev.preventDefault();

    closeSheet();
  });

    if (ev.target !== sheet) return;
    if (sheetQueue.length) nextAward(); else closeSheet();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;

    else if (!dateSheet.hidden) closeDates();

  });

    if (document.visibilityState === "hidden") flush(false);
  });

    if (db) startCloud(db); else startLocal();
  }, function () { startLocal(); });
})();

const FXS = {
  // 營火：火星從下方火光冒出，一直往上飄、一邊閃一邊淡掉，速度和數量固定
  sparks: {
    init(st, W, H) { st.p = []; st.acc = 0; for (let i = 0; i < 200; i++) this.move(st, .05, W, H); },
    move(st, dt, W, H) {
      st.acc += Math.min(110, 32 * W / 360) * dt;

        st.acc -= 1;
        st.p.push({ x: W / 2 + (Math.random() + Math.random() - 1) * W * .55, y: H - 10 - Math.random() * Math.min(180, H * .2),
          vx: (Math.random() - .5) * 8, vy: -(16 + Math.random() * 30), r: 3 + Math.random() ** 3 * 7,
          age: 0, life: 5 + Math.random() * 6, ph: Math.random() * 6.28, fl: 2 + Math.random() * 5 });
      }

    },
    draw(st, g) {

  },
  // 螢火蟲：慢慢飛、各自一閃一閃；練習時一起跟著呼吸亮暗（吸飽最亮、吐完最暗）

    },
    move(st, dt, W, H, t, br) {

  // ---------- 右上角選單 ----------
  function setMenu(open) {
